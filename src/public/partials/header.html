<!DOCTYPE html>
<!DOCTYPE html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CharGen Harness - Uncensored RP Character &amp; Vision Studio</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<!-- Top Header Navigation -->
<header>
<div class="brand">
<span class="brand-badge">UNCENSORED</span>
<span class="brand-title">CHARGEN HARNESS</span>
<span class="brand-sub">/ RP Architect &amp; Vision Forge</span>
</div>
<div class="header-actions">
<!-- Direct Header Prompt Preset Switcher -->
<div id="header-prompt-container" style="display: flex; align-items: center; gap: 4px;" title="Switch Prompt Architecture &amp; Engine Preset">
<select class="form-select" id="header-prompt-select" style="font-size: 11px; font-weight: 700; padding: 4px 8px; height: 28px; min-width: 170px; max-width: 250px; background: rgba(6, 182, 212, 0.15); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); cursor: pointer; border-radius: 6px;">
<!-- Dynamically populated -->
</select>
<button class="btn btn-xs" id="btn-header-edit-prompt" style="padding: 4px 7px; height: 28px; font-size: 11px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px;" title="Inspect &amp; Customize Prompt Templates in Settings" type="button">
          ⚙️
        </button>
</div>
<div id="header-provider-badge" style="font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 6px; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; cursor: pointer;" title="Click to configure API key">
        ⚠️ NO API KEY (NO FREE AI)
      </div>
<div id="header-ipc-badge" style="font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 6px; background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; color: #60a5fa; cursor: pointer;" title="IPC WebSocket Bridge for External QML / Desktop Apps">
        ⚡ IPC Connecting...
      </div>
<button class="btn btn-sm" id="btn-toggle-llm-cache" style="background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399;" title="Toggle Persistent LLM Response Cache. When active, failed/interrupted runs or repeated prompts use saved responses instantly without re-calling the AI.">
        ⚡ Cache: ON (<span id="llm-cache-count">0</span>)
      </button>
<button class="btn btn-sm" id="btn-restore-autosave" style="display:none; background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fbbf24;" title="Recover autosaved card draft">
        ⚡ Recover Autosave
      </button>
<button class="btn btn-sm" id="btn-open-library" title="Manage your saved cards, variants &amp; local decks">
        📚 Library <span id="library-count-badge" style="font-size: 10px; background: rgba(59, 130, 246, 0.3); padding: 1px 5px; border-radius: 8px;">0</span>
</button>
<button class="btn btn-sm" id="btn-open-households" style="background: rgba(236, 72, 153, 0.15); border: 1px solid #ec4899; color: #f472b6;" title="Manage Custom Households, Courts &amp; Group Encounter Binders">
        👑 Households &amp; Courts <span id="households-count-badge" style="font-size: 10px; background: rgba(236, 72, 153, 0.4); color: #fff; padding: 1px 6px; border-radius: 8px;">0</span>
</button>
<button class="btn btn-sm" id="btn-open-image-queue" style="background: rgba(147, 51, 234, 0.15); border: 1px solid #9333ea; color: #c084fc;" title="Offline Image Prompt Queue: generate prompts for multiple characters, then turn off LLM and run ComfyUI">
        🖼️ Image Queue <span id="image-queue-count-badge" style="font-size: 10px; background: rgba(168, 85, 247, 0.4); color: #fff; padding: 1px 6px; border-radius: 8px;">0</span>
</button>
<button class="btn btn-sm" id="btn-open-agent-fullscreen" style="background: rgba(6, 182, 212, 0.15); border: 1px solid #06b6d4; color: #22d3ee; font-weight: 600;" title="Full Screen Agent Co-Pilot Studio (Large chat view with collapsable card sidebar)">
        🤖 Agent Studio (Fullscreen)
      </button>
<button class="btn btn-sm" id="btn-open-history" title="View revision history and visual before/after diff">
        🕒 History &amp; Diff <span id="history-count-badge" style="font-size: 10px; background: rgba(16, 185, 129, 0.3); padding: 1px 5px; border-radius: 8px;">1</span>
</button>
<button class="btn btn-sm" id="btn-import-card">
        📂 Import (PNG/JSON/CharX)
      </button>
<input accept=".png,.json,.charx" id="file-import-input" style="display:none;" type="file"/>
<button class="btn btn-sm btn-success" id="btn-export-png" title="Export PNG with dual V2 (chara) and V3 (ccv3) metadata chunks embedded">
        💾 Export PNG (V2+V3)
      </button>
<button class="btn btn-sm" id="btn-export-charx" style="background: rgba(168, 85, 247, 0.18); border: 1px solid var(--accent-purple); color: #c084fc;" title="Export standard Character Card V3 / Lumiverse .charx container bundle">
        📦 Export .charx (V3)
      </button>
<button class="btn btn-sm" id="btn-export-json" title="Export standard Character Card V3 JSON">
        📄 Export JSON (V3)
      </button>
<button class="btn btn-sm" id="btn-export-legacy-json" style="opacity: 0.8;" title="Export legacy Character Card V2 JSON for external sites without V3 support (Chub, Botbooru)">
        📜 Legacy V2 (Chub)
      </button>
<button class="btn btn-sm" id="btn-open-settings">
        ⚙️ Settings
      </button>
</div>
</header>
