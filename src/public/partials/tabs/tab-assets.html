<div class="tab-content hidden" id="tab-assets" style="display: flex; flex-direction: column; gap: 10px;">
  <div style="background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(59, 130, 246, 0.12)); border: 1px solid #06b6d4; border-radius: var(--radius-sm); padding: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <span style="font-size: 13px; font-weight: 700; color: #cffafe;">📦 Asset Pipeline Plugins</span>
      <span style="font-size: 10px; background: rgba(6, 182, 212, 0.25); color: #22d3ee; padding: 2px 6px; border-radius: 4px; font-weight: 600;">EXPRESSIONS & VTT</span>
    </div>
    <div style="font-size: 11px; color: var(--text-muted); line-height: 1.4;">
      Generate expression sprite sheets (8 faces), outfit variants (4 sets), and VTT texture atlases dispatched to ComfyClient IPC.
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #e2e8f0; cursor: pointer;">
      <input type="checkbox" id="asset-chk-expressions" checked />
      <span>😊 Expression Sheet (8 Canonical Expressions)</span>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #e2e8f0; cursor: pointer;">
      <input type="checkbox" id="asset-chk-outfits" checked />
      <span>👗 Outfit Variants (Canonical, Combat, Casual, Formal)</span>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #e2e8f0; cursor: pointer;">
      <input type="checkbox" id="asset-chk-atlas" checked />
      <span>🗺️ Texture Atlas & VTT Pack (Tokens, Insignia, Prop Atlas)</span>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent-cyan); margin-top: 4px; cursor: pointer;">
      <input type="checkbox" id="asset-chk-dispatch-comfy" checked />
      <span>⚡ Send Directly to ComfyClient Socket (/tmp/comfyclient.sock)</span>
    </label>
  </div>

  <button class="btn btn-primary" id="btn-generate-assets" style="justify-content: center; padding: 10px; font-weight: 700; margin-top: 4px;" type="button">
    <span>🎨 Generate Character Asset Packs</span>
  </button>

  <div id="asset-gen-feedback" style="font-size: 11px; color: var(--text-muted); line-height: 1.4;"></div>
</div>
