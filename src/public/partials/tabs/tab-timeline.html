<div class="tab-content hidden" id="tab-timeline" style="display: flex; flex-direction: column; gap: 10px;">
  <div style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(59, 130, 246, 0.12)); border: 1px solid #10b981; border-radius: var(--radius-sm); padding: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <span style="font-size: 13px; font-weight: 700; color: #a7f3d0;">⏳ Narrative Timeline & Story Arc</span>
      <span style="font-size: 10px; background: rgba(16, 185, 129, 0.25); color: #34d399; padding: 2px 6px; border-radius: 4px; font-weight: 600;">CHRONO TRACKER</span>
    </div>
    <div style="font-size: 11px; color: var(--text-muted); line-height: 1.4;">
      Track chronological story beats across scenario, first message, and roleplay arcs. Continue arcs forward or branch into flashbacks.
    </div>
  </div>

  <div style="display: flex; gap: 6px;">
    <button class="btn btn-secondary" id="btn-timeline-extract" style="flex: 1; font-size: 11px; padding: 6px;" type="button">
      <span>Auto-Extract Beats</span>
    </button>
    <button class="btn btn-secondary" id="btn-timeline-add" style="flex: 1; font-size: 11px; padding: 6px;" type="button">
      <span>+ Add Beat</span>
    </button>
  </div>

  <div id="timeline-events-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; padding-right: 2px;">
    <div style="font-size: 11px; color: var(--text-dim); text-align: center; padding: 12px;">No timeline beats recorded yet.</div>
  </div>

  <div style="border-top: 1px solid var(--border-subtle); padding-top: 8px; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 12px; font-weight: 700; color: #e2e8f0;">Continue Story Arc Forward</span>
    <input class="form-input" id="arc-time-advance" placeholder="Temporal jump (e.g. Three months later, Next morning)" value="Three months later" type="text" />
    <input class="form-input" id="arc-focus-plot" placeholder="Plot focus or consequence..." type="text" />
    <button class="btn btn-primary" id="btn-continue-arc" style="justify-content: center; padding: 8px; font-weight: 700;" type="button">
      <span>⏩ Advance Story Arc & Generate Beat</span>
    </button>
  </div>
</div>

<!-- TAB: Git-like Character Branching -->
